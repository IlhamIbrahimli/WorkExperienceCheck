<tr id="row-{{ url.id }}">
  <td class="td-id">{{ url.id }}</td>
  <td class="td-name">{{ url.name }}</td>
  <td class="td-link">
    <a href="{{ url.link }}" target="_blank" rel="noopener">{{ url.link }}</a>
  </td>
  <td class="td-mono">{{ url.yearToApply or '—' }}</td>
  <td class="td-mono">{{ url.lastCheck or '—' }}</td>
  <td class="td-actions">
    <button
      class="btn-delete"
      hx-delete="/delete_link/{{ url.id }}"
      hx-target="#row-{{ url.id }}"
      hx-swap="outerHTML"
      hx-confirm="Remove {{ url.name }}?"
      title="Delete"
    >×</button>
  </td>
</tr>
